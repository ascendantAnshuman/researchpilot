# Run the whole of ResearchPilot with one command (from this folder):
#
#   docker compose up --build
#
# then open http://localhost:3000. Configuration comes from .env (copy .env.example first).
# Data (SQLite database, ChromaDB index, cached PDFs) is kept in the "researchpilot-data" volume.

services:
  backend:
    build: ./backend
    image: researchpilot-backend
    env_file: .env
    environment:
      DATA_DIR: /data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - researchpilot-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The browser talks to the backend directly, so this is a URL on *your* machine.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: researchpilot-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  researchpilot-data:
